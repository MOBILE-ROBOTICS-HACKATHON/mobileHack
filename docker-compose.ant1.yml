version: "3.8"

services:
  ant1_bridge:
    build:
      context: .
      dockerfile: Dockerfile.ant1_bridge
    container_name: ant1_bridge
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 run team_pkg ant1_bridge"
    restart: unless-stopped

  ant1_dummy_tester:
    build:
      context: .
      dockerfile: Dockerfile.ant1_bridge
    container_name: ant1_dummy_tester
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 run team_pkg ant1_dummy_pub --ros-args -p loop:=true"
    profiles:
      - test
